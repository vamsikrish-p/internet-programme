<div class="question">

<pre>
<h1>Welcome
<p>This is a paragraph
<img src="image.jpg">
</pre>

<h3>Problems</h3>

<ul>

<li>Missing &lt;/h1&gt;</li>

<li>Missing &lt;/p&gt;</li>

<li>Image should include alt attribute.</li>

<li>Browsers auto-correct but HTML is invalid.</li>

</ul>

<h3>Correct HTML</h3>

<pre>
<h1>Welcome</h1>
<p>This is a paragraph</p>
<img src="image.jpg" alt="Sample Image">
</pre>
